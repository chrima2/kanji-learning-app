<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanji Quest: Radical Learning</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Mobile App Fixes */
        body { 
            overscroll-behavior-y: none; /* Verhindert pull-to-refresh */
        }
        button { 
            touch-action: manipulation; /* Verhindert Double-Tap Zoom für instantanes Klicken */
            -webkit-tap-highlight-color: transparent; 
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slideUp { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        
        /* Hide scrollbar for path view */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<!-- h-[100dvh] ist der Fix für mobile Browser, damit die UI nicht hinter der Adresszeile verschwindet -->

    <div id="root" class="w-full max-w-md h-full relative flex flex-col bg-gray-900 border-x border-gray-800 shadow-2xl"></div>

                rapid: [

                    { q: "Wasser + Jeden (海) = ?", opts: ["Meer", "Fluss", "Regen"], a: 0 },

            },
            {

                foundation: {

                },

                synthesis: {

                    { q: "Was bedeutet 口?", opts: ["Box", "Mund/Öffnung", "Kreis"], a: 1 },

                ]
            },

                foundation: {

                },
                grid: {

                },
                synthesis: {

                },

                    word: "日本語 (Nihongo)",

                    options: ["Japanische Sprache", "Japanisches Essen", "Japanische Kultur"],

                },
                rapid: [
                    { q: "Was bedeutet 言?", opts: ["Ohr", "Sprechen/Wort", "Auge"], a: 1 },

            },

                },

                },
                synthesis: {

                    explanation: "Sieben Schwertstreiche bedeuten ganz klar 'Schneiden' (切)."
                },
                vocab: {
                    word: "大切 (Taisetsu)",
                    question: "Groß (大) + Schneiden (切) = ? (Was man für sich herausschneidet)",
                    options: ["Wichtig / Bedeutend", "Gefährlich", "Scharf"],
                    answer: 0,
                    explanation: "Dinge, die man 'groß ausschneidet', sind einem Wichtig (Taisetsu)."
                },
                rapid: [
                    { q: "Was ist 刀/刂?", opts: ["Schwert", "Pfeil", "Bogen"], a: 0 },
                    { q: "Sieben + Schwert (切) = ?", opts: ["Blocken", "Schneiden", "Stechen"], a: 1 },
                    { q: "Taisetsu bedeutet?", opts: ["Unwichtig", "Scharf", "Wichtig"], a: 2 }
                ]

        ];

        const HeartIcon = ({ filled }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={filled ? "#ef4444" : "none"} stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        const App = () => {
            const [view, setView] = useState('path');
            const [unlocked, setUnlocked] = useState(1);
            const [hearts, setHearts] = useState(5);
            const [activeLessonId, setActiveLessonId] = useState(1);

            if (view === 'path') {
                return (
                    <div className="flex-1 flex flex-col h-full overflow-hidden">
                        <div className="p-4 flex justify-between items-center bg-gray-900 border-b border-gray-800 shrink-0">
                            <h1 className="text-xl font-bold text-white tracking-widest">KANJI QUEST</h1>
                            <div className="flex gap-1 items-center font-bold text-red-500">
                                <HeartIcon filled={true} /> {hearts}
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar p-6 flex flex-col-reverse items-center justify-start gap-8 pt-12 pb-24">
                            {LESSONS.map((lesson, idx) => {
                                const isUnlocked = lesson.id <= unlocked;
                                const isCurrent = lesson.id === unlocked;
                                const offset = idx % 2 === 0 ? '-translate-x-6' : 'translate-x-6';
                                return (
                                    <button 
                                        key={lesson.id}
                                        disabled={!isUnlocked}
                                        onClick={() => { setActiveLessonId(lesson.id); setView('lesson'); }}
                                        className={`w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold shadow-lg transition-transform ${offset} 
                                            ${isUnlocked ? 'bg-green-500 hover:scale-105 active:scale-95 text-white' : 'bg-gray-800 text-gray-600'}
                                            ${isCurrent ? 'ring-4 ring-green-300 ring-offset-4 ring-offset-gray-900 animate-bounce' : ''}`}
                                    >
                                        {lesson.radical}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            if (view === 'gameover') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
                        <HeartIcon filled={false} />
                        <h2 className="text-3xl font-bold text-red-500 mt-4 mb-2">Keine Leben mehr!</h2>
                        <p className="text-gray-400 mb-8">Lade deine Leben auf, um weiterzulernen.</p>
                        <button onClick={() => { setHearts(5); setView('path'); }} className="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl active:scale-95 transition-transform">
                            Neu starten
                        </button>
                    </div>
                );
            }

            return <LessonView 
                        lesson={LESSONS.find(l => l.id === activeLessonId)} 
                        onComplete={() => {
                            if (activeLessonId === unlocked) setUnlocked(u => Math.min(10, u + 1));
                            setView('path');
                        }}
                        onFail={() => {
                            setHearts(h => {
                                if (h <= 1) { setView('gameover'); return 0; }
                                return h - 1;
                            });
                        }}
                        onQuit={() => setView('path')}
                        hearts={hearts}
                    />;
        };

        const LessonView = ({ lesson, onComplete, onFail, onQuit, hearts }) => {
            const [phase, setPhase] = useState(0); 
            const [rapidStep, setRapidStep] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [shake, setShake] = useState(false);
            const [gridItems, setGridItems] = useState([]);
            const [selectedGrid, setSelectedGrid] = useState([]);

            useEffect(() => {
                if (phase === 1) {
                    const items = [
                        ...lesson.grid.right.map(char => ({ char, isRight: true })),
                        ...lesson.grid.wrong.map(char => ({ char, isRight: false }))
                    ];
                    setGridItems(shuffle(items));
                    setSelectedGrid([]);
                }
            }, [phase, lesson]);

            const triggerWrong = (msg) => {
                setShake(true); setTimeout(() => setShake(false), 400);
                setFeedback({ status: 'wrong', msg });
                onFail();
            };

            const handleCheck = (answerObj) => {
                if (phase === 1) {
                    const allCorrect = selectedGrid.every(idx => gridItems[idx].isRight) && selectedGrid.length === 4;
                    if (allCorrect) {
                        setFeedback({ status: 'correct', msg: 'Perfekt! Du hast das Muster erkannt.' });
                    } else {
                        triggerWrong("Falsch. Eines oder mehrere Zeichen enthalten das Radikal nicht.");
                        setSelectedGrid([]);
                    }
                    return;
                }

                if (answerObj.selected === answerObj.correct) {
                    setFeedback({ status: 'correct', msg: answerObj.explanation || "Richtig!" });
                } else {
                    triggerWrong(answerObj.explanation || "Das war leider falsch.");
                }
            };

            const handleNext = () => {
                setFeedback(null);
                if (phase === 4) {
                    if (rapidStep < 2) setRapidStep(r => r + 1);
                    else onComplete();
                } else {
                    setPhase(p => p + 1);
                }
            };

            const progress = ((phase * 10 + (phase === 4 ? rapidStep * 3 : 0)) / 50) * 100;

            return (
                <div className="flex-1 flex flex-col h-full relative overflow-hidden">
                    {/* Header */}
                    <div className="p-4 flex items-center gap-4 shrink-0 bg-gray-900 z-10">
                        <button onClick={onQuit} className="text-gray-500 hover:text-white p-2 -ml-2">✕</button>
                        <div className="flex-1 bg-gray-800 rounded-full h-3 overflow-hidden">
                            <div className="bg-green-500 h-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="flex gap-1 items-center font-bold text-red-500">
                            <HeartIcon filled={true} /> {hearts}
                        </div>
                    </div>

                    {/* Content Body - pb-40 ensures we can scroll past the feedback overlay if needed */}
                    <div className={`flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col pb-40 ${shake ? 'animate-shake' : ''}`}>
                        
                        {phase === 0 && (
                            <div className="flex flex-col h-full">
                                <h2 className="text-lg sm:text-xl font-bold mb-2 text-gray-400">Das Fundament</h2>
                                <div className="flex-1 flex flex-col items-center justify-center min-h-[30vh] mb-4">
                                    <div className="text-8xl sm:text-9xl mb-4 text-white font-serif">{lesson.radical}</div>
                                    <p className="text-center text-base sm:text-lg text-gray-300">{lesson.foundation.text}</p>
                                </div>
                                <div className="mt-auto">
                                    <h3 className="font-bold mb-3">{lesson.foundation.question}</h3>
                                    <div className="flex flex-col gap-2">
                                        {lesson.foundation.options.map((opt, i) => (
                                            <button key={i} onClick={() => !feedback && handleCheck({selected: i, correct: lesson.foundation.answer, explanation: lesson.foundation.explanation})}
                                                    disabled={feedback !== null}
                                                    className="w-full bg-gray-800 border-2 border-gray-700 p-4 rounded-xl text-left font-bold active:bg-gray-700 transition-colors">
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {phase === 1 && (
                            <div className="flex flex-col h-full">
                                <h2 className="text-lg sm:text-xl font-bold mb-1 text-gray-400">Mustererkennung</h2>
                                <p className="mb-4 text-sm sm:text-base">Wähle genau 4 Zeichen mit <span className="font-bold text-blue-400 text-lg">{lesson.radical}</span>.</p>
                                <div className="grid grid-cols-3 gap-2 sm:gap-3 mb-6">
                                    {gridItems.map((item, i) => {
                                        const isSelected = selectedGrid.includes(i);
                                        return (
                                            <button key={i} 
                                                    disabled={feedback !== null}
                                                    onClick={() => {
                                                        if (isSelected) setSelectedGrid(selectedGrid.filter(x => x !== i));
                                                        else if (selectedGrid.length < 4) setSelectedGrid([...selectedGrid, i]);
                                                    }}
                                                    className={`aspect-square rounded-2xl text-4xl sm:text-5xl font-serif flex items-center justify-center transition-all border-2
                                                        ${isSelected ? 'bg-blue-900 border-blue-500 text-white scale-95' : 'bg-gray-800 border-gray-700 text-gray-300 active:scale-95'}`}>
                                                {item.char}
                                            </button>
                                        );
                                    })}
                                </div>
                                <div className="mt-auto">
                                   <button 
                                        disabled={selectedGrid.length !== 4 || feedback !== null}
                                        onClick={handleCheck}
                                        className={`w-full py-4 rounded-2xl font-bold text-lg transition-colors active:scale-95 ${selectedGrid.length === 4 ? 'bg-blue-500 text-white' : 'bg-gray-800 text-gray-500'}`}>
                                        Überprüfen
                                    </button>
                                </div>
                            </div>
                        )}

                        {phase === 2 && (
                            <div className="flex flex-col h-full">
                                <h2 className="text-lg sm:text-xl font-bold mb-2 text-gray-400">Synthese</h2>
                                <div className="flex-1 flex flex-col items-center justify-center min-h-[25vh] mb-6 bg-gray-800 rounded-3xl p-4 border-2 border-gray-700">
                                    <div className="text-2xl sm:text-3xl font-bold text-center tracking-widest">{lesson.synthesis.equation}</div>
                                </div>
                                <div className="mt-auto">
                                    <h3 className="font-bold mb-3">{lesson.synthesis.question}</h3>
                                    <div className="flex flex-col gap-2">
                                        {lesson.synthesis.options.map((opt, i) => (
                                            <button key={i} onClick={() => !feedback && handleCheck({selected: i, correct: lesson.synthesis.answer, explanation: lesson.synthesis.explanation})}
                                                    disabled={feedback !== null}
                                                    className="w-full bg-gray-800 border-2 border-gray-700 p-4 rounded-xl text-left font-bold active:bg-gray-700 transition-colors">
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {phase === 3 && (
                            <div className="flex flex-col h-full">
                                <h2 className="text-lg sm:text-xl font-bold mb-2 text-gray-400">Im echten Leben</h2>
                                <div className="flex-1 flex flex-col items-center justify-center min-h-[25vh] mb-6">
                                    <div className="text-5xl sm:text-6xl mb-4 text-white font-serif">{lesson.vocab.word}</div>
                                </div>
                                <div className="mt-auto">
                                    <h3 className="font-bold mb-3">{lesson.vocab.question}</h3>
                                    <div className="flex flex-col gap-2">
                                        {lesson.vocab.options.map((opt, i) => (
                                            <button key={i} onClick={() => !feedback && handleCheck({selected: i, correct: lesson.vocab.answer, explanation: lesson.vocab.explanation})}
                                                    disabled={feedback !== null}
                                                    className="w-full bg-gray-800 border-2 border-gray-700 p-4 rounded-xl text-left font-bold active:bg-gray-700 transition-colors">
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {phase === 4 && (
                            <div className="flex flex-col h-full">
                                <h2 className="text-lg sm:text-xl font-bold mb-2 text-orange-400">Rapid Fire ({rapidStep + 1}/3)</h2>
                                <div className="flex-1 flex flex-col items-center justify-center min-h-[20vh] mb-6">
                                    <div className="text-xl sm:text-2xl text-center font-bold px-4">{lesson.rapid[rapidStep].q}</div>
                                </div>
                                <div className="mt-auto">
                                    <div className="flex flex-col gap-2">
                                        {lesson.rapid[rapidStep].opts.map((opt, i) => (
                                            <button key={i} onClick={() => !feedback && handleCheck({selected: i, correct: lesson.rapid[rapidStep].a, explanation: null})}
                                                    disabled={feedback !== null}
                                                    className="w-full bg-gray-800 border-2 border-gray-700 p-4 rounded-xl text-left font-bold active:bg-gray-700 transition-colors">
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Feedback Overlay - fixed to absolute bottom, animating up */}
                    {feedback && (
                        <div className={`absolute bottom-0 left-0 w-full p-4 pb-6 sm:p-6 sm:pb-8 ${feedback.status === 'correct' ? 'bg-green-100 text-green-900 border-t-4 border-green-500' : 'bg-red-100 text-red-900 border-t-4 border-red-500'} rounded-t-3xl animate-slideUp shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-50`}>
                            <div className="flex items-start sm:items-center gap-3 mb-3">
                                <div className={`w-8 h-8 rounded-full flex shrink-0 items-center justify-center text-white font-bold mt-1 sm:mt-0 ${feedback.status === 'correct' ? 'bg-green-500' : 'bg-red-500'}`}>
                                    {feedback.status === 'correct' ? '✓' : '✕'}
                                </div>
                                <div className="flex-1">
                                    <h3 className="text-lg sm:text-xl font-bold">{feedback.status === 'correct' ? 'Klasse!' : 'Falsch'}</h3>
                                    {feedback.msg && <p className="font-medium text-sm sm:text-base mt-1 leading-tight">{feedback.msg}</p>}
                                </div>
                            </div>
                            <button onClick={handleNext} className={`w-full mt-2 py-4 rounded-2xl font-bold text-lg text-white shadow-md active:scale-95 transition-transform ${feedback.status === 'correct' ? 'bg-green-500' : 'bg-red-500'}`}>
                                Weiter
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

        :root {

        body {

        }
        button { 
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .animate-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
                    osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1); // A6
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.15);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                    osc.stop(ctx.currentTime + 0.2);

                                                        else if (selectedGrid.length < 4) setSelectedGrid([...selectedGrid, i]);
                                                    }}
                                                    className={`aspect-square rounded-xl text-3xl font-serif flex items-center justify-center transition-all duration-200 border
                                                        ${isSelected ? 'bg-cyan-950/50 border-cyan-500/50 text-cyan-300 scale-95 shadow-[inset_0_0_15px_rgba(6,182,212,0.2)]' : 'bg-zinc-900 border-zinc-800 text-zinc-400 active:scale-95'}`}>
                                                {item.char}
                                            </button>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="flex flex-col gap-3 animate-popIn">
                                    <p className="text-xs text-zinc-500 font-light mb-1 px-1">
                                        {phase === 0 ? lesson.foundation.question : 
                                         phase === 2 ? lesson.synthesis.question : 
                                         phase === 3 ? lesson.vocab.question : "Wähle schnell:"}
                                    </p>
                                    {(phase === 0 ? lesson.foundation : phase === 2 ? lesson.synthesis : phase === 3 ? lesson.vocab : lesson.rapid[rapidStep]).options.map((opt, i) => (
                                        <button key={i} disabled={feedback !== null}
                                                onClick={() => handleCheck({
                                                    selected: i, 
                                                    correct: (phase === 0 ? lesson.foundation : phase === 2 ? lesson.synthesis : phase === 3 ? lesson.vocab : lesson.rapid[rapidStep]).answer, 
                                                    explanation: (phase === 4 ? null : (phase === 0 ? lesson.foundation : phase === 2 ? lesson.synthesis : lesson.vocab).explanation)
                                                })}
                                                className="w-full bg-zinc-900/80 backdrop-blur border border-zinc-800 p-4 rounded-xl text-left text-sm font-medium text-zinc-300 active:bg-zinc-800 active:border-cyan-500/30 transition-all">
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Fixed Footer Area (Dynamic Content) */}
                    <div className="h-28 shrink-0 w-full border-t border-white/5 bg-zinc-950 flex flex-col justify-center px-6 relative z-20">
                        {feedback ? (
                            <div className="flex items-center justify-between w-full h-full animate-popIn">
                                <div className="flex-1 mr-4">
                                    <h3 className={`text-sm font-bold tracking-wide ${feedback.status === 'correct' ? 'text-cyan-400' : 'text-rose-400'}`}>
                                        {feedback.status === 'correct' ? 'VERIFIZIERT' : 'FEHLER'}
                                    </h3>
                                    {feedback.msg && <p className="text-zinc-400 text-xs mt-1 leading-snug">{feedback.msg}</p>}
                                </div>
                                <button onClick={handleNext} className={`shrink-0 px-8 py-3 rounded-lg font-bold text-sm tracking-wide active:scale-95 transition-transform ${feedback.status === 'correct' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/30'}`}>
                                    WEITER
                                </button>
                            </div>
                        ) : phase === 1 ? (
                            <button disabled={selectedGrid.length !== 4} onClick={handleCheck}
                                    className={`w-full py-4 rounded-lg font-bold text-sm tracking-widest uppercase transition-all duration-300
                                    ${selectedGrid.length === 4 ? 'bg-zinc-100 text-zinc-900 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.1)]' : 'bg-zinc-900 border border-zinc-800 text-zinc-600'}`}>
                                Analyse Starten
                            </button>
                        ) : (
                            <div className="w-full text-center text-zinc-700 text-xs uppercase tracking-widest font-light">
                                Wähle einen Parameter
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
